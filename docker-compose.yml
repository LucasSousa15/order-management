services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.13-bookworm

    volumes:
      - .:/workspace:cached

    working_dir: /workspace
    command: sleep infinity

    env_file:
      - .env

    ports:
      - "5173:5173"
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      postgres_test:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17-alpine

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}

    ports:
      - "5433:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
